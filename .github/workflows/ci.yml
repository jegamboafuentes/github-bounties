name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  v0:
    name: V0 webhook + hello
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - name: Hello canary
        working-directory: services/hello
        run: npm test

  schema:
    name: V1 migrate + seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: github_bounties
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d github_bounties"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://gb:gb@127.0.0.1:5432/github_bounties
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - name: Migrate empty Postgres
        run: npm run db:migrate
      - name: Seed
        run: npm run db:seed
      - name: Re-run migrate + seed (idempotent)
        run: npm run db:migrate && npm run db:seed
      - run: npm run test:db
      - name: Build Cloud Run standalone
        run: npm run build
