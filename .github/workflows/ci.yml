name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  v0:
    name: V0 webhook + hello
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - name: Hello canary
        working-directory: services/hello
        run: npm test
      - name: V1-7 staging wiring
        run: bash scripts/check-staging-wiring.sh
      - name: DATABASE_URL proxy rewrite
        run: node --test infra/gcloud/proxy-database-url.test.mjs

  schema:
    name: V1 migrate + seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gb
          POSTGRES_PASSWORD: gb
          POSTGRES_DB: github_bounties
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb -d github_bounties"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://gb:gb@127.0.0.1:5432/github_bounties
      # Cookie-signing placeholder for `next build` only. Not a production secret. No live Google in CI.
      AUTH_SECRET: ci-build-placeholder-not-a-production-secret
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - name: Migrate empty Postgres
        run: npm run db:migrate
      - name: Seed
        run: npm run db:seed
      - name: Re-run migrate + seed (idempotent)
        run: npm run db:migrate && npm run db:seed
      - run: npm run test:db
      - name: Build Cloud Run standalone
        run: npm run build
      - name: Standalone traces @coinbase/cdp-sdk
        run: |
          node --input-type=module -e "
          import { existsSync } from 'node:fs';
          const roots = [
            '.next/standalone/node_modules/@coinbase/cdp-sdk',
            '.next/standalone/apps/web/node_modules/@coinbase/cdp-sdk',
          ];
          const x402Roots = [
            '.next/standalone/node_modules/@x402/core',
            '.next/standalone/apps/web/node_modules/@x402/core',
          ];
          const found = roots.find((r) => existsSync(r));
          const x402 = x402Roots.find((r) => existsSync(r));
          if (!found || !x402) {
            console.error('CDP SDK / @x402/core missing from Next standalone output', { roots, x402Roots });
            process.exit(1);
          }
          console.log('standalone includes', found, x402);
          "
