# Local Postgres for GitHub Bounties schema work.
# Placeholder credentials for laptop/CI only — not Cloud SQL, not staging.
# Ops sets Secret Manager DATABASE_URL out-of-band for github-bounties-staging.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gb
      POSTGRES_PASSWORD: gb
      POSTGRES_DB: github_bounties
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gb -d github_bounties"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - github_bounties_pg:/var/lib/postgresql/data

volumes:
  github_bounties_pg:
