# GitHub Bounties — Cloud Build for apps/web (V1 product)
# Project: experiment-jegf / 42206083192
# Separate from cloudbuild.yaml (hello canary). Do not point that file here.
#
# Does not inject secret values. Cloud Run --set-secrets pulls from Secret Manager.
# First-deploy secret *names* already have enabled versions (Ops preflight 2026-09-10).
# Do not bind CDP_WEBHOOK_SECRET (enabled_versions=0), CRON_SECRET (not in SM),
# or AUTH_URL (create after the live origin). AUTH_TRUST_HOST=true is plain env.
#
# Always tags :$BUILD_ID and :latest so manual `gcloud builds submit` works.
# $COMMIT_SHA is empty on manual submit unless you pass
# --substitutions=COMMIT_SHA=$(git rev-parse HEAD).
#
# --allow-unauthenticated is for the browser + GitHub webhooks. Org DRS may
# still 403 allUsers (authenticated curl / roles/run.invoker).

substitutions:
  _REGION: us-central1
  _AR_REPO: github-bounties
  _SERVICE: github-bounties-web
  _IMAGE: github-bounties-web
  _PUBLIC_BASE_URL: ""
  _ATTACH_OPTIONAL_SECRETS: "0"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: apps/web
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:latest
      - .

  - id: maybe-tag-commit-sha
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}"
        if [ -n "$COMMIT_SHA" ]; then
          docker tag "$$IMAGE:$BUILD_ID" "$$IMAGE:$COMMIT_SHA"
          docker push "$$IMAGE:$COMMIT_SHA"
        else
          echo "COMMIT_SHA empty; skipping SHA tag (ok for manual submit)."
        fi

  - id: push-build-id
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:$BUILD_ID

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:latest

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    env:
      - PUBLIC_BASE_URL=${_PUBLIC_BASE_URL}
      - GB_ATTACH_OPTIONAL_SECRETS=${_ATTACH_OPTIONAL_SECRETS}
      - GB_REGION=${_REGION}
    args:
      - -c
      - |
        bash infra/gcloud/deploy-web.sh --apply --secrets=static --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:$BUILD_ID"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:latest
